<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Instalável no celular (ver public/manifest.webmanifest e public/sw.js). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#081d33" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AthosBI" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>AthosBI</title>
    <script>
      // Aplica o tema salvo antes de qualquer coisa pintar na tela — sem
      // isso, a página sempre nasceria clara por uma fração de segundo e
      // "piscaria" pro escuro assim que o React montasse.
      (function () {
        try {
          var theme = localStorage.getItem("athosbi.theme") || "light";
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
