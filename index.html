<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Instalável no celular (ver public/manifest.webmanifest e public/sw.js). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#081d33" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AthosBI" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>AthosBI</title>
    <script>
      // O endereço antigo (athosbi.vercel.app) foi aposentado: quem cair lá
      // (favorito, link de e-mail antigo) vai pro endereço oficial, com o
      // mesmo caminho — um link de convite/senha continua funcionando. O
      // vercel.json já redireciona no servidor; isto é a garantia no navegador.
      (function () {
        if (location.hostname === "athosbi.vercel.app") {
          location.replace("https://bi.athosconsultoriaempresarial.com" + location.pathname + location.search + location.hash);
        }
      })();
    </script>
    <script>
      // Aplica o tema salvo antes de qualquer coisa pintar na tela — sem
      // isso, a página sempre nasceria clara por uma fração de segundo e
      // "piscaria" pro escuro assim que o React montasse.
      (function () {
        try {
          var theme = localStorage.getItem("athosbi.theme") || "light";
          document.documentElement.dataset.theme = theme;
          // Visual novo (hub) — ver lib/hub.js aplicarTemaDoHub.
          if (localStorage.getItem("athosbi.hub") === "1") document.documentElement.dataset.hub = "1";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- Enquanto o app baixa: a marca da Athos se montando (mesma animação de
         components/Carregando.jsx). O React troca isso pela tela de verdade. -->
    <style>
      .splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: #f4f6f9; color: #5b6670; font: 13px/1.4 system-ui, sans-serif; letter-spacing: 0.02em; }
      :root[data-theme="dark"] .splash { background: #16181c; color: #9aa0a8; }
      :root[data-hub] .splash { background: #f5f7fb; color: #63738a; }
      :root[data-hub][data-theme="dark"] .splash { background: #080c14; color: #949fae; }
      .splash rect { transform-box: fill-box; transform-origin: center; animation: splash-degrau 1.8s cubic-bezier(0.3, 0.7, 0.2, 1) infinite both; }
      .splash .trilho { width: 160px; height: 4px; border-radius: 4px; overflow: hidden; background: rgb(127 127 127 / 0.15); }
      .splash .barra { width: 40%; height: 100%; border-radius: 4px; background: #e8691f; animation: splash-barra 1.3s cubic-bezier(0.45, 0, 0.25, 1) infinite; }
      @keyframes splash-degrau { 0% { opacity: 0.12; transform: translateY(6px) scale(0.7); } 18%, 62% { opacity: 1; transform: none; } 82%, 100% { opacity: 0.12; transform: scale(0.85); } }
      @keyframes splash-barra { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { .splash rect, .splash .barra { animation: none; } }
    </style>
    <div id="root">
      <div class="splash" role="status">
        <svg viewBox="5 4 51 51" width="64" height="64" aria-hidden="true">
          <rect x="7" y="39" width="15" height="15" rx="3" fill="#7e341a" style="animation-delay: 0s" />
          <rect x="24" y="39" width="15" height="15" rx="3" fill="#92391a" style="animation-delay: 0.11s" />
          <rect x="40" y="39" width="15" height="15" rx="3" fill="#a9401a" style="animation-delay: 0.22s" />
          <rect x="24" y="22" width="15" height="15" rx="3" fill="#be451a" style="animation-delay: 0.33s" />
          <rect x="40" y="22" width="15" height="15" rx="3" fill="#d34b1c" style="animation-delay: 0.44s" />
          <rect x="40" y="6" width="15" height="15" rx="3" fill="#e75220" style="animation-delay: 0.55s" />
        </svg>
        <span>Carregando portal…</span>
        <div class="trilho"><div class="barra"></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
