<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AthosBI</title>
    <script>
      // Aplica o tema salvo antes de qualquer coisa pintar na tela — sem
      // isso, a página sempre nasceria clara por uma fração de segundo e
      // "piscaria" pro escuro assim que o React montasse.
      (function () {
        try {
          var theme = localStorage.getItem("athosbi.theme") || "light";
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
